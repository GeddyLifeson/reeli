name: Supabase keep-alive

# Supabase's free tier pauses a project after about a week with no API
# activity — the whole backend (accounts, sync, OAuth) goes dark until
# someone manually resumes it from the dashboard. This workflow prevents
# that by making one real, lightweight API request a couple of times a
# week, well inside that window.
#
# The key below is the same public anon key already shipped in app.js
# (SUPA_KEY) — it's meant to be public; Supabase's row-level security
# policies, not key secrecy, are what control access. No repo secret
# needed.
on:
  schedule:
    # 12:00 UTC every Monday and Thursday — a max ~3-4 day gap, safely
    # under the ~7 day inactivity window.
    - cron: "0 12 * * 1,4"
  workflow_dispatch: # lets anyone trigger it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -f \
            -H "apikey: ${SUPA_KEY}" \
            -H "Authorization: Bearer ${SUPA_KEY}" \
            "https://mnulgfeeqyjkewmvriiv.supabase.co/rest/v1/profiles?select=id&limit=1"
        env:
          SUPA_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1udWxnZmVlcXlqa2V3bXZyaWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NDE2MTAsImV4cCI6MjEwMDQxNzYxMH0.7NLxMKa_1QJwkU7WZCsuQYCTTmuMv_7BbwEfbzvc-SA
