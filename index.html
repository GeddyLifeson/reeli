<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Reeli — rank every movie you've seen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E6B5C">
<meta name="description" content="Reeli is Beli for movies: rank every film you've seen in head-to-head matchups — no star ratings — then follow your Reelmates, compare taste, and swap hot takes.">
<meta name="google-site-verification" content="FcWbi3D38FNkUqmb4DM6b851-CtJQJit_0riy9w-eXg">
<link rel="canonical" href="https://reeli.org/">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Reeli",
  "url": "https://reeli.org/",
  "description": "Rank every movie you've seen in head-to-head matchups. No star ratings — every score is earned. Follow friends, compare taste, share hot takes.",
  "applicationCategory": "EntertainmentApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>
<meta property="og:title" content="Reeli — rank every movie you've seen">
<meta property="og:description" content="No star ratings. Every movie earns its score in head-to-head matchups. Follow your Reelmates and compare taste.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://reeli.org/">
<meta property="og:image" content="https://reeli.org/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">

<a class="skip" href="#scr-feed">Skip to content</a>
<div class="app">
  <header class="top">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="var(--accent)" stroke-width="2.2"/>
        <circle cx="12" cy="7.6" r="1.7" fill="var(--accent)"/><circle cx="12" cy="16.4" r="1.7" fill="var(--accent)"/>
        <circle cx="7.6" cy="12" r="1.7" fill="var(--accent)"/><circle cx="16.4" cy="12" r="1.7" fill="var(--accent)"/>
      </svg>
      <span class="wordmark">Reeli</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="screen-tag" id="screenTag">Feed</span>
      <button class="iconbtn" id="notifBtn" title="Notifications" aria-label="Notifications" style="position:relative;display:none">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge" id="notifBadge" aria-hidden="true" style="top:-3px;right:-3px;left:auto"></span>
      </button>
      <button class="iconbtn" id="themeBtn" title="Theme: auto" aria-label="Cycle color theme" style="font-size:15px"><span aria-hidden="true">◐</span></button>
    </div>
  </header>

  <!-- One screen is display:none-d at a time, so only the visible one is ever in
       the accessibility tree. Each is labelled by the <h1> its render function
       writes into the .pad, which is what makes them navigable as regions. -->
  <main class="screens" id="main">
    <section class="screen" id="scr-feed" aria-label="Feed"><div class="pad" id="feedWrap"></div></section>
    <section class="screen" id="scr-ranks" aria-label="Your ranking"><div class="pad" id="ranksWrap"></div></section>
    <section class="screen" id="scr-search" aria-label="Rank a movie"><div class="pad" id="searchWrap"></div></section>
    <section class="screen" id="scr-watch" aria-label="Watchlist"><div class="pad" id="watchWrap"></div></section>
    <section class="screen" id="scr-profile" aria-label="Profile"><div class="pad" id="profileWrap"></div></section>
  </main>

  <!-- The badges are decorative duplicates: the count they show is folded into
       each button's aria-label by updateBadge / setNotifBadge / setFeedDot, so
       a screen reader hears "Watchlist, 3 saved" instead of a bare "3". -->
  <nav class="nav" aria-label="Main">
    <button data-nav="feed" class="cur" aria-current="page" aria-label="Feed"><span class="badge" id="feedDot" aria-hidden="true"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Feed</button>
    <button data-nav="ranks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="2.6"/></svg>Ranks</button>
    <button data-nav="search" aria-label="Rank a movie"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button data-nav="watch" aria-label="Watchlist"><span class="badge" id="watchBadge" aria-hidden="true"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>Watchlist</button>
    <button data-nav="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-3.6 4.4-5.5 8-5.5s6.5 1.9 8 5.5"/></svg>Profile</button>
  </nav>

  <div class="auth" id="gate" role="dialog" aria-modal="true" aria-label="Sign in to Reeli"></div>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Details"><div class="sheet" id="sheet"></div></div>
  <!-- Two live regions. #toast is polite chatter ("Copied", "Added"); #alert is
       assertive and carries failures the user needs to act on. Both are in the
       DOM from first paint — a live region announced only after it is inserted
       is a live region that never announces. -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="alertbar" id="alert" role="alert" aria-live="assertive" aria-atomic="true" hidden></div>
  <div class="sr-only" id="srstatus" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<!-- Load order matters. posters.js and matching.js/ranking.js define no-op-at-load
     globals; app.js is last because it reads REELI_PREBAKED_POSTERS the moment it
     runs. Plain classic scripts, not modules: they share one global scope, exactly
     as the single inline script they were split out of did. No build step. -->
<script src="posters.js"></script>
<script src="ranking.js"></script>
<script src="matching.js"></script>
<script src="app.js"></script>
</html>
